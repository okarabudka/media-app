# Development only: the Vite dev server on localhost serves the modules, injects CSS as <style> elements and
# reloads over a WebSocket; Symfony's error pages use inline scripts and styles.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' http://localhost:*; style-src 'self' 'unsafe-inline' http://localhost:*; img-src 'self' https://image.tmdb.org http://localhost:*; font-src 'self' http://localhost:*; connect-src 'self' http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
