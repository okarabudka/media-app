x-project: &project .:/var/www

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    init: true
    environment:
      # `make demo` sets it to 1 for this run; otherwise the value from .env applies.
      TMDB_DEMO: ${TMDB_DEMO:-0}
    volumes:
      - *project
    depends_on:
      - redis
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    init: true
    ports:
      - ${APP_PORT:-8080}:80
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/csp.dev.conf:/etc/nginx/snippets/csp.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Vite dev server with hot reload. `make up` starts it once package-lock.json exists.
  node:
    image: node:22-alpine
    profiles: [frontend]
    init: true
    user: ${UID:-1000}:${GID:-1000}
    working_dir: /var/www
    environment:
      HOME: /tmp
      VITE_PORT: ${VITE_PORT:-5173}
    volumes:
      - *project
    ports:
      - ${VITE_PORT:-5173}:5173
    command: sh -c "npm ci --ignore-scripts && npm run dev"
    restart: unless-stopped
