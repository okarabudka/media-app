# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    app.auth_cookie_name: auth_token
    # Older .env files predate demo mode; without the variable it stays off.
    env(TMDB_DEMO): '0'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
