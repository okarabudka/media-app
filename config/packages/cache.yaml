framework:
    cache:
        prefix_seed: media-app
        default_redis_provider: '%env(REDIS_URL)%'
        pools:
            cache.tmdb:
                adapter: cache.adapter.redis
            cache.rate_limiter:
                adapter: cache.adapter.redis

# Tests run without Redis. Filesystem instead of array pools, because array pools are emptied between the
# requests of one test; ApiTestCase clears these pools before every test.
when@test:
    framework:
        cache:
            pools:
                cache.tmdb:
                    adapter: cache.adapter.filesystem
                cache.rate_limiter:
                    adapter: cache.adapter.filesystem
