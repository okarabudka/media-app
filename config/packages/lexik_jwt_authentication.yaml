lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 3600
    # The token only travels in an httpOnly cookie, so JavaScript can never read it.
    token_extractors:
        authorization_header:
            enabled: false
        cookie:
            enabled: true
            name: '%app.auth_cookie_name%'
