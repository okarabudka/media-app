# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    # The API is stateless (JWT in a cookie); no PHP session is ever started.
    session: false

    http_client:
        scoped_clients:
            tmdb.client:
                base_uri: '%env(TMDB_BASE_URI)%'
                headers:
                    Accept: 'application/json'
                timeout: 5
                max_duration: 10

when@test:
    framework:
        test: true
        # No test ever reaches the real TMDB.
        http_client:
            mock_response_factory: App\Tests\Support\TmdbMock
