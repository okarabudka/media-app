version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    groups:
      symfony:
        patterns: ['symfony/*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Same safety margin as bin/lock-assets: only releases that are at least two weeks old.
    cooldown:
      default-days: 14

  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: monthly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
