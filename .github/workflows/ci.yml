name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, redis
          tools: composer:v2
          coverage: none
      - name: Environment from the example file
        run: cp .env.example .env
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint container, YAML and Twig
        run: |
          php bin/console lint:container
          php bin/console lint:yaml config --parse-tags
          php bin/console lint:twig templates
      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: PHPStan (level max)
        run: |
          php bin/console cache:warmup --env=test
          vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: PHPUnit (no network, no TMDB token)
        run: vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from the lock file without lifecycle scripts
        run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: The bundle never talks to the TMDB API directly
        run: '! grep -rq "api.themoviedb.org" public/build'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Environment with CI-only demo credentials
        run: |
          make env
          sed -i -e 's/^AUTH_USERNAME=$/AUTH_USERNAME=ci/' -e 's/^AUTH_PASSWORD=$/AUTH_PASSWORD=ci-only-password/' .env
      - name: Development stack with the Vite dev server
        run: make up
      - name: Wait for the Vite dev server
        run: timeout 180 sh -c 'until curl -fs http://localhost:5173/build/@vite/client > /dev/null; do sleep 2; done'
      - run: bin/smoke-test
      - name: Production-like stack with compiled assets
        run: make prod-up
      - run: bin/smoke-test "http://localhost:$(grep -E '^PROD_PORT=' .env | cut -d= -f2)"
      - if: failure()
        run: |
          docker compose --profile frontend logs
          docker compose -f compose.prod.yaml logs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
